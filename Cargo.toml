[package]
name = "stockdb-rs"
version = "0.1.0"
edition = "2021"
description = "A股列式存储数据库: 定长二进制 + 全局交易日历 t 对齐 + mmap 零拷贝随机读"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/stockdb-rs"

[dependencies]
memmap2 = "0.9"
byteorder = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
md-5 = "0.10"

[dev-dependencies]
